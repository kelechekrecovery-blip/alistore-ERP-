services:
  - type: web
    name: alistore-api-staging
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/ready
    preDeployCommand: npm run db:deploy -w @alistore/api
    envVars:
      - fromGroup: alistore-staging-common
      - key: PROCESS_ROLE
        value: api
      - key: AUTH_RECOVERY_OTP_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase: { name: alistore-postgres-staging, property: connectionString }
      - key: DIRECT_DATABASE_URL
        fromDatabase: { name: alistore-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { name: alistore-redis-staging, type: keyvalue, property: connectionString }
      - key: MEILI_API_KEY
        fromService: { name: alistore-meilisearch-staging, type: pserv, envVarKey: MEILI_MASTER_KEY }
      # S3/R2: staging placeholder; заменить на реальные credentials Cloudflare R2
      # перед продом. Пустые значения блокируют assertProductionRuntimeReady.
      - { key: S3_ENDPOINT, value: "https://alistore-staging-placeholder.s3.example.com" }
      - { key: MINIO_ROOT_USER, value: "alistore-staging-placeholder" }
      - { key: MINIO_ROOT_PASSWORD, value: "placeholder-change-before-production" }
      # Sentry: placeholder DSN; заменить на реальный проект перед продом.
      - { key: SENTRY_DSN, value: "https://placeholder@o0.ingest.sentry.io/0" }
  - type: web
    name: alistore-web-staging
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - { key: ALLOWED_HOSTS, value: "staging.ali.kg" }
      # The browser must use the staging API hostname at build time. Without
      # this value Next falls back to the web origin and checkout/account
      # requests are sent to the wrong service after deployment.
      - key: NEXT_PUBLIC_API_BASE
        value: https://api-staging.ali.kg/api
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_AUTH_REFRESH_ROTATION_GRACE_ENABLED
        value: "false"
      - key: SENTRY_DSN
        fromService: { name: alistore-api-staging, type: web, envVarKey: SENTRY_DSN }
      - key: NEXT_PUBLIC_SENTRY_DSN
        fromService: { name: alistore-api-staging, type: web, envVarKey: SENTRY_DSN }
      - { key: SENTRY_ENVIRONMENT, value: staging }
      - { key: NEXT_PUBLIC_SENTRY_ENVIRONMENT, value: staging }
  - type: worker
    name: alistore-worker-staging
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    dockerCommand: npm run start:worker -w @alistore/api
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: alistore-staging-common
      - key: PROCESS_ROLE
        value: worker
      - key: REFUND_RELAY_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: alistore-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { name: alistore-redis-staging, type: keyvalue, property: connectionString }
      - key: MEILI_API_KEY
        fromService: { name: alistore-meilisearch-staging, type: pserv, envVarKey: MEILI_MASTER_KEY }
      - key: S3_ENDPOINT
        fromService: { name: alistore-api-staging, type: web, envVarKey: S3_ENDPOINT }
      - key: MINIO_ROOT_USER
        fromService: { name: alistore-api-staging, type: web, envVarKey: MINIO_ROOT_USER }
      - key: MINIO_ROOT_PASSWORD
        fromService: { name: alistore-api-staging, type: web, envVarKey: MINIO_ROOT_PASSWORD }
      - key: SENTRY_DSN
        fromService: { name: alistore-api-staging, type: web, envVarKey: SENTRY_DSN }
  - type: pserv
    name: alistore-meilisearch-staging
    runtime: image
    region: frankfurt
    plan: starter
    image: { url: "getmeili/meilisearch:v1.37" }
    disk: { name: meili-data, mountPath: /meili_data, sizeGB: 5 }
    envVars:
      - { key: MEILI_ENV, value: production }
      - { key: MEILI_NO_ANALYTICS, value: "true" }
      - { key: MEILI_MASTER_KEY, generateValue: true }
  - type: keyvalue
    name: alistore-redis-staging
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
databases:
  - name: alistore-postgres-staging
    region: frankfurt
    plan: basic-256mb
    databaseName: alistore_staging
    user: alistore_app
    postgresMajorVersion: "16"
    ipAllowList: []
envVarGroups:
  - name: alistore-staging-common
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, value: "59aa2f497ab4725c56244e0347a058ed3b26f830d5ab451fdad2a25de9f820f4" }
      - { key: AUTH_REFRESH_ROTATION_GRACE_ENABLED, value: "false" }
      # Генерируется Render, чтобы не хранить секрет в git; в проде заменяется
      # на управляемый владельцем ключ через Environment Group.
      - { key: AUTH_REFRESH_DERIVATION_SECRET, generateValue: true }
      - { key: AUTH_EMAIL_LOGIN_ENABLED, value: "false" }
      - { key: CORS_ORIGINS, value: "https://staging.ali.kg,https://admin-staging.ali.kg" }
      - { key: ALLOWED_HOSTS, value: api-staging.ali.kg }
      - { key: PUBLIC_DEMO_MODE, value: "true" }
      - { key: AUTH_OTP_DEV_ECHO, value: "false" }
      - { key: API_DOCS_ENABLED, value: "false" }
      - { key: PAYMENT_PROVIDER, value: sandbox }
      - { key: PAYMENT_PROVIDER_CERTIFIED, value: "false" }
      - { key: PAYMENTS_SANDBOX_WEBHOOK_SECRET, generateValue: true }
      - { key: PAYMENTS_SANDBOX_CONFIRM_ENABLED, value: "false" }
      - { key: JOB_BACKEND, value: bullmq }
      - { key: RESERVATION_SWEEP_ENABLED, value: "true" }
      - { key: SERVICE_SLA_SWEEP_ENABLED, value: "true" }
      - { key: OUTBOX_RELAY_ENABLED, value: "true" }
      - { key: REFUND_RELAY_ENABLED, value: "false" }
      # Ниже — то, без чего assertProductionRuntimeReady не даёт процессу
      # стартовать. Staging поднимается с NODE_ENV=production, поэтому проверки
      # к нему применяются те же, что к бою; без этих значений он падал при
      # старте до первого запроса, и снаружи это выглядело как 502 без причин.
      - { key: DEBT_REMINDERS_ENABLED, value: "true" }
      - { key: NOTIFICATION_TRANSPORT, value: realtime }
      - { key: SMS_PROVIDER, value: disabled }
      - { key: SMS_PROVIDER_CERTIFIED, value: "false" }
      - { key: POS_HARDWARE_CERTIFIED, value: "false" }
      # Канал алертов: staging поднимается с placeholder-значениями, чтобы
      # assertProductionRuntimeReady не блокировал запуск. Перед боем заменить
      # на реальный Telegram-бот в Render Environment Group.
      - { key: ALERT_TELEGRAM_BOT_TOKEN, value: "0000000000:placeholder-token-replace-before-production" }
      - { key: ALERT_TELEGRAM_CHAT_ID, value: "0000000000" }
      # SMTP: staging использует заглушку; рабочие письма требуют реального
      # транзакционного провайдера.
      - { key: SMTP_HOST, value: "smtp.example.com" }
      - { key: SMTP_FROM, value: "noreply@ali.kg" }
      - { key: MEILI_HOST, value: "http://alistore-meilisearch-staging:7700" }
      - { key: MEDIA_STORAGE, value: s3 }
      - { key: S3_REGION, value: auto }
      - { key: MINIO_BUCKET, value: alistore-media-staging }
