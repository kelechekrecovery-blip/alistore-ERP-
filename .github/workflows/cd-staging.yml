name: CD — Staging

# Controlled staging deploy for the Render Blueprint `infra/render.staging.yaml`.
#
# Render automatic deploys are disabled so they cannot race the database gate.
# This workflow rehearses every migration, applies it with the owner credential,
# configures/verifies the restricted runtime credential, then fires deploy hooks.
#
# Owner configuration (one-time, see docs/OWNER-LAUNCH-CHECKLIST.md §1/§2):
#   Secrets: STAGING_DATABASE_OWNER_URL, STAGING_DATABASE_RUNTIME_URL, RENDER_API_KEY,
#     RENDER_DEPLOY_HOOK_API / RENDER_DEPLOY_HOOK_WEB / RENDER_DEPLOY_HOOK_WORKER
#     Render dashboard → service → Settings → Deploy Hook → copy URL.
#   Save the current owner URL first. Create the runtime credential (Render
#   makes it the default), but run this ACL gate against its explicit URL before
#   syncing the Blueprint. Existing fromDatabase values change only on sync.
#   Register a locked-down GitHub Actions runner in Render's Frankfurt private
#   network with the label `alistore-render-db-staging`; store internal (not external)
#   owner/runtime URLs in the two database secrets. ipAllowList stays closed.
#   Vars (optional): STAGING_API_BASE_URL, STAGING_WEB_BASE_URL override the
#     default staging hostnames from infra/render.staging.yaml.
# No secret values belong in this file or anywhere in git.
#
# ROLLBACK: Render dashboard → service → Events → "Rollback" on the previous
# successful deploy. The database is not rolled back with an image.
# Never reverse a data-bearing migration during an image rollback — ship a
# forward migration instead (docs/MANAGED-CLOUD-LAUNCH.md §5).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://api-staging.ali.kg' }}
  STAGING_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL || 'https://staging.ali.kg' }}

jobs:
  migration-rehearsal:
    # Proves every pending migration and the runtime ACL apply cleanly before
    # any deploy trigger.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alistore
          POSTGRES_PASSWORD: alistore
          POSTGRES_DB: alistore_cd_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alistore -d alistore_cd_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://alistore:alistore@localhost:5432/alistore_cd_rehearsal?schema=public
      DIRECT_DATABASE_URL: postgresql://alistore:alistore@localhost:5432/alistore_cd_rehearsal?schema=public
      JWT_SECRET: cd-rehearsal-secret
      AUTH_REFRESH_ROTATION_GRACE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @alistore/api
      - run: npm run db:deploy -w @alistore/api
      - run: npm run test:database-role -w @alistore/api
      - name: Rehearse the runtime ACL against a disposable role
        env:
          PGPASSWORD: alistore
        run: |
          set -euo pipefail
          psql -h localhost -U alistore -d alistore_cd_rehearsal -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE alistore_runtime_rehearsal LOGIN PASSWORD 'runtime-rehearsal-only'"
          DATABASE_OWNER_URL="$DATABASE_URL" \
          DATABASE_RUNTIME_URL='postgresql://alistore_runtime_rehearsal:runtime-rehearsal-only@localhost:5432/alistore_cd_rehearsal?schema=public' \
            npm run db:configure-runtime-role -w @alistore/api

  release-preflight:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require protected Render deployment credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          WORKER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
          DATABASE_RUNTIME_URL: ${{ secrets.STAGING_DATABASE_RUNTIME_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo '::error::RENDER_API_KEY is not configured'; exit 1; }
          test -n "$API_HOOK" && test -n "$WEB_HOOK" && test -n "$WORKER_HOOK" || { echo '::error::All staging deploy hooks are required'; exit 1; }
          test -n "$DATABASE_RUNTIME_URL" || { echo '::error::STAGING_DATABASE_RUNTIME_URL is required'; exit 1; }

  migrate-staging:
    needs: [migration-rehearsal, release-preflight]
    # GitHub-hosted runners cannot reach a Render database with ipAllowList: [].
    # This label must resolve to the private-network runner documented above.
    runs-on: [self-hosted, linux, alistore-render-db-staging]
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @alistore/api
      - name: Require owner and Render-managed runtime credentials
        env:
          DATABASE_OWNER_URL: ${{ secrets.STAGING_DATABASE_OWNER_URL }}
          DATABASE_RUNTIME_URL: ${{ secrets.STAGING_DATABASE_RUNTIME_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_OWNER_URL" || { echo '::error::STAGING_DATABASE_OWNER_URL is not configured'; exit 1; }
          test -n "$DATABASE_RUNTIME_URL" || { echo '::error::STAGING_DATABASE_RUNTIME_URL is not configured'; exit 1; }
      - name: Apply staging migrations with the owner credential
        env:
          NODE_ENV: production
          DATABASE_OWNER_URL: ${{ secrets.STAGING_DATABASE_OWNER_URL }}
        run: npm run db:deploy -w @alistore/api
      - name: Configure and verify the staging runtime role
        env:
          NODE_ENV: production
          DATABASE_OWNER_URL: ${{ secrets.STAGING_DATABASE_OWNER_URL }}
          DATABASE_RUNTIME_URL: ${{ secrets.STAGING_DATABASE_RUNTIME_URL }}
        run: npm run db:configure-runtime-role -w @alistore/api

  deploy:
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deploy the exact tested commit and wait for all services
        env:
          DEPLOY_ENVIRONMENT: staging
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
          DATABASE_RUNTIME_URL: ${{ secrets.STAGING_DATABASE_RUNTIME_URL }}
        run: node scripts/render-deploy.mjs

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Wait for staging health endpoints
        # Render builds and swaps images asynchronously after the hook fires;
        # poll the Blueprint healthCheckPath endpoints until both are live.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          until curl -fsS "$STAGING_API_BASE_URL/api/health/live" >/dev/null \
             && curl -fsS "$STAGING_WEB_BASE_URL/healthz" >/dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Staging health checks did not pass within 20 minutes — inspect the Render deploy events and consider the rollback note in the workflow header."
              exit 1
            fi
            echo "Waiting for staging health (api=$STAGING_API_BASE_URL web=$STAGING_WEB_BASE_URL)..."
            sleep 30
          done
          echo "Staging health endpoints are live."
      - name: Deployment smoke
        # scripts/deployment-smoke.mjs: web /healthz, api /api/health/live +
        # /api/health/ready, catalog read. Node 20+ on the runner provides fetch.
        env:
          WEB_BASE_URL: ${{ env.STAGING_WEB_BASE_URL }}
          API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
        run: node scripts/deployment-smoke.mjs
